<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HammerInABox</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: 1fr auto;
      background: #fff;
      color: #666;
      font-family: Arial, sans-serif;
    }

    main {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    img {
      display: block;
      width: 100%;
      max-width: 554px;
      max-width: min(554px, calc(100svh - 108px));
      height: auto;
    }

    footer {
      padding: 16px 24px 24px;
      text-align: center;
      font-size: 12px;
      line-height: 20px;
    }

    .elsewhere {
      position: fixed;
      top: 16px;
      right: 16px;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 1px solid #ddd;
      border-radius: 50%;
      background: #fff;
      color: #777;
      font-size: 15px;
      text-decoration: none;
    }

    .elsewhere:hover {
      border-color: #777;
      color: #222;
    }

    .elsewhere:focus-visible {
      outline: 2px solid #222;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <a class="elsewhere" href="elsewhere.html" aria-label="Go somewhere else">?</a>
  <main>
    <img src="sad-face.png" alt="A blue sad face" width="554" height="554">
  </main>
  <footer>Credits: Jose Carvajal-Beltran</footer>
</body>
</html>
