<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dancing squirrel</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: 1fr auto;
      background: #fff;
      color: #666;
      font-family: Arial, sans-serif;
    }
    main { display: grid; place-items: center; padding: 24px; }
    video {
      display: block;
      width: 100%;
      max-width: 500px;
      max-width: min(500px, calc(100svh - 108px));
      height: auto;
    }
    .back {
      position: fixed;
      top: 16px;
      left: 16px;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 1px solid #ddd;
      border-radius: 50%;
      background: #fff;
      color: #777;
      text-decoration: none;
    }
    a { color: inherit; text-underline-offset: 3px; }
    a:focus-visible { outline: 2px solid #222; outline-offset: 4px; }
    footer { padding: 16px 24px 24px; text-align: center; font-size: 12px; line-height: 20px; }
  </style>
</head>
<body>
  <a class="back" href="./" aria-label="Back to the main page">&larr;</a>
  <main>
    <video autoplay muted loop playsinline width="640" height="640" aria-label="A squirrel dancing">
      <source src="dancing-squirrel.mp4" type="video/mp4">
      <a href="https://tenor.com/view/squirrel-dancing-squirrel-oh-yeah-win-dance-gif-16411835">Watch the dancing squirrel</a>
    </video>
  </main>
  <footer>Jose Carvajal-Beltran &middot; <a href="https://tenor.com/view/squirrel-dancing-squirrel-oh-yeah-win-dance-gif-16411835">animation source</a></footer>
</body>
</html>
